description: >-
  FinOps view of eZee Technosys (Yanolja Cloud Solution) spend. eZee bills via
  sales-led product subscriptions (eZee Absolute PMS, eZee Centrix channel
  manager, eZee Reservation booking engine, eZee Optimus POS) rather than
  metered, per-request API charges. The YCS Connectivity Portal API is a
  partner integration capability bundled with product / partner agreements and
  is not separately metered with public pricing. Cost dimensions below are
  therefore framed around subscription and property scope, and meter values are
  not reconciled against a public price list.
notes: >-
  Subscription pricing is sales-led and not publicly listed; API connectivity
  is provisioned through partner agreements without public per-request pricing.
  Verify commercial terms and any usage-based components directly with eZee /
  Yanolja Cloud Solution.
