meters:
- name: product_subscription
  description: Monthly / annual subscription to eZee hospitality products, priced via sales.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - property
  - product
- name: property_count
  description: Number of properties (HotelCodes) provisioned, a primary subscription scaling dimension.
  unit: properties
  aggregation: sum
  dimensions:
  - account
- name: connectivity_access
  description: Partner connectivity provisioning per property; bundled with agreements, not separately metered publicly.
  unit: properties
  aggregation: sum
  dimensions:
  - account
  - property
principles:
- name: Visibility
  description: Track active product subscriptions and provisioned properties (HotelCodes) against invoices.
- name: Allocation
  description: Map subscription cost to properties / business units by HotelCode.
- name: Optimization
  description: Right-size product modules per property and consolidate connectivity through a single partner integration.
- name: Accountability
  description: Assign owners per property and review subscription spend against the negotiated agreement.
