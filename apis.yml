name: eZee Technosys
kind: company
description: eZee Technosys is a hospitality technology company offering eZee Absolute
  (cloud hotel PMS), eZee Centrix (channel manager), eZee Reservation (booking engine),
  and eZee Optimus (restaurant POS). Its YCS Connectivity Portal exposes a
  partner-gated HTTP API for PMS connectivity, channel manager, booking engine,
  and POS integrations so third-party systems can sync reservations, room
  inventory, rates, restrictions, and guest data. eZee is now part of Yanolja
  Cloud (Yanolja Cloud Solution).
